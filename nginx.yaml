apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment-argocd
spec:
  replicas: 4
  selector:
    matchLabels:
      app: nginx-deployment-argocd
  template:
    metadata:
      labels:
        app: nginx-deployment-argocd
    spec:
      containers:
        - name: nginx-deployment-argocd
          image: nginx:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service-srgocd
spec:
  type: NodePort
  selector:
    app: nginx-deployment-argocd
  ports:
    - name: http
      port: 8443
      targetPort: 80
